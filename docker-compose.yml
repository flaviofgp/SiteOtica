services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: traco
      POSTGRES_PASSWORD: traco
      POSTGRES_DB: traco_optica
    ports:
      - "5432:5432"
    volumes:
      - traco_optica_db_data:/var/lib/postgresql/data

volumes:
  traco_optica_db_data:
